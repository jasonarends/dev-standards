name: lint

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.13"

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
      - run: python -m pip install pre-commit==4.7.0
      - run: pre-commit run --all-files --show-diff-on-failure
