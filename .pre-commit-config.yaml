repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 9026c9127e153371d7a78dfcb0c45ae2046a3d10  # frozen: v0.17.6
    hooks:
      - id: ruff-check
      - id: ruff-format
        args: [--check]
  - repo: local
    hooks:
      - id: no-comments
        name: no new code comments
        entry: python3 src/dev_standards/no_comments.py
        language: system
        types_or: [python, shell]
      - id: ruff-rules
        name: ruff selects the standard rules
        entry: python3 src/dev_standards/ruff_rules.py
        language: system
        pass_filenames: false
        always_run: true
